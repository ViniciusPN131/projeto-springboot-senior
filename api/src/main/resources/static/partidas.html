<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidas de Basquete</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 20px;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      border: 3px solid #ff5e14;
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    
    h1 i {
      color: #ff5e14;
      margin: 0 10px;
    }
    
    .partidas-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    
    .partida-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #ff5e14;
      transition: all 0.3s ease;
    }
    
    .partida-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    
    .partida-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .partida-times {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .partida-vs {
      font-weight: bold;
      color: #ff5e14;
      margin: 0 10px;
    }
    
    .partida-data {
      background-color: #2c3e50;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    
    .partida-info {
      margin-top: 15px;
    }
    
    .partida-info p {
      margin: 8px 0;
      color: #333;
    }
    
    .partida-info strong {
      color: #2c3e50;
      font-weight: 600;
    }
    
    .resultado-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .resultado-btn:hover {
      background: linear-gradient(45deg, #c0392b, #e74c3c);
      transform: translateY(-2px);
    }
    
    .erro {
      color: #e74c3c;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 5px;
    }
    
    .voltar-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: linear-gradient(45deg, #2c3e50, #34495e);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .voltar-btn:hover {
      background: linear-gradient(45deg, #34495e, #2c3e50);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    @media (max-width: 768px) {
      .partida-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      
      .container {
        padding: 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>
      <i class="fas fa-basketball-ball"></i>
      Partidas de Basquete
      <i class="fas fa-basketball-ball"></i>
    </h1>
    
    <div class="partidas-list" id="lista-partidas"></div>
    <p class="erro" id="mensagem-erro" style="display: none;"></p>
    
    <button class="voltar-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>

  <script>
    const url = 'http://localhost:8080/partidas';

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao buscar as partidas');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('lista-partidas');
        
        if (data.content && data.content.length > 0) {
          data.content.forEach(partida => {
            const card = document.createElement('div');
            card.className = 'partida-card';
            
            // Formatando a data
            const dataHora = new Date(partida.dataHora);
            const dataFormatada = dataHora.toLocaleDateString('pt-BR');
            const horaFormatada = dataHora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            card.innerHTML = `
              <div class="partida-header">
                <div class="partida-times">
                  <span>${partida.timeCasa}</span>
                  <span class="partida-vs">vs</span>
                  <span>${partida.timeVisitante}</span>
                </div>
                <div class="partida-data">
                  <i class="fas fa-calendar-alt"></i> ${dataFormatada} - ${horaFormatada}
                </div>
              </div>
              <div class="partida-info">
                <p><strong>Local:</strong> ${partida.local}</p>
                <button class="resultado-btn" onclick="verResultado(${partida.id})">
                  <i class="fas fa-chart-line"></i> Ver Resultado
                </button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          document.getElementById('mensagem-erro').style.display = 'block';
          document.getElementById('mensagem-erro').textContent = 'Nenhuma partida encontrada.';
        }
      })
      .catch(error => {
        document.getElementById('mensagem-erro').style.display = 'block';
        document.getElementById('mensagem-erro').textContent = error.message;
        console.error('Erro:', error);
      });

    function verResultado(partidaId) {
      fetch(`http://localhost:8080/partidas/resultado/${partidaId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar resultado da partida');
          }
          return response.json();
        })
        .then(resultado => {
          alert(`Resultado da partida:\n${resultado.timeCasa}: ${resultado.pontosCasa}\n${resultado.timeVisitante}: ${resultado.pontosVisitante}`);
        })
        .catch(error => {
          console.error('Erro:', error);
          alert('Erro ao buscar resultado: ' + error.message);
        });
    }
  </script>
</body>
</html>
