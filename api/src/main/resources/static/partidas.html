<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidas</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      margin: 20px;
    }
    
    .botao-menu {
      padding: 10px 15px;
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
    }
    
    #lista-partidas {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .partida-card {
      border: 1px solid #ddd;
      padding: 15px;
    }
    
    .partida-times {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .partida-vs {
      margin: 0 5px;
    }
    
    .partida-data {
      margin-bottom: 10px;
    }
    
    .partida-info {
      margin-top: 10px;
    }
    
    .resultado-btn {
      padding: 5px 10px;
      margin-top: 5px;
      cursor: pointer;
    }
    
    #mensagem-erro {
      margin-top: 20px;
    }
    
    .paginacao {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .paginacao button {
      padding: 5px 10px;
      cursor: pointer;
    }
    
    .pagina-atual {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="botao-menu" onclick="window.location.href='index.html'">MENU</button>
  
  <div class="container">
    <h1>Partidas</h1>
    <div id="mensagem-erro"></div>
    <div id="lista-partidas"></div>
    <div class="paginacao">
      <button id="btn-anterior" disabled>Anterior</button>
      <span id="pagina-atual" class="pagina-atual">1</span>
      <button id="btn-proximo">Próxima</button>
    </div>
  </div>

  <script>
    let paginaAtual = 0; // A API geralmente começa com página 0
    const itensPorPagina = 10; // Ajuste conforme sua API
    let totalPaginas = 1;

    function carregarPartidas(pagina) {
      const url = `http://localhost:8080/partidas?page=${pagina}&size=${itensPorPagina}`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar as partidas');
          }
          return response.json();
        })
        .then(data => {
          const container = document.getElementById('lista-partidas');
          container.innerHTML = '';
          
          if (data.content && data.content.length > 0) {
            data.content.forEach(partida => {
              const card = document.createElement('div');
              card.className = 'partida-card';
              
              const dataHora = new Date(partida.dataHora);
              const dataFormatada = dataHora.toLocaleDateString('pt-BR');
              const horaFormatada = dataHora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
              
              card.innerHTML = `
                <div class="partida-header">
                  <div class="partida-times">
                    <span>${partida.timeCasa}</span>
                    <span class="partida-vs">vs</span>
                    <span>${partida.timeVisitante}</span>
                  </div>
                  <div class="partida-data">
                    ${dataFormatada} - ${horaFormatada}
                  </div>
                </div>
                <div class="partida-info">
                  <p><strong>Local:</strong> ${partida.local}</p>
                  <button class="resultado-btn" onclick="verResultado(${partida.id})">
                    Ver Resultado
                  </button>
                </div>
              `;
              container.appendChild(card);
            });

            // Atualiza controles de paginação
            totalPaginas = data.totalPages || 1;
            document.getElementById('pagina-atual').textContent = pagina + 1;
            document.getElementById('btn-anterior').disabled = pagina === 0;
            document.getElementById('btn-proximo').disabled = pagina >= totalPaginas - 1;
          } else {
            document.getElementById('mensagem-erro').textContent = 'Nenhuma partida encontrada.';
          }
        })
        .catch(error => {
          document.getElementById('mensagem-erro').textContent = error.message;
          console.error('Erro:', error);
        });
    }

    // Event listeners para os botões de paginação
    document.getElementById('btn-anterior').addEventListener('click', () => {
      if (paginaAtual > 0) {
        paginaAtual--;
        carregarPartidas(paginaAtual);
      }
    });

    document.getElementById('btn-proximo').addEventListener('click', () => {
      if (paginaAtual < totalPaginas - 1) {
        paginaAtual++;
        carregarPartidas(paginaAtual);
      }
    });

    function verResultado(partidaId) {
      fetch(`http://localhost:8080/partidas/resultado/${partidaId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar resultado da partida');
          }
          return response.json();
        })
        .then(resultado => {
          alert(`Resultado da partida:\n${resultado.timeMandante}: ${resultado.pontosMandante}\n${resultado.timeVisitante}: ${resultado.pontosVisitante}`);
        })
        .catch(error => {
          console.error('Erro:', error);
          alert('Erro ao buscar resultado: ' + error.message);
        });
    }

    // Carrega a primeira página ao iniciar
    carregarPartidas(paginaAtual);
  </script>
</body>
</html>
