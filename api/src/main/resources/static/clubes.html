<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clubes</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      margin: 20px;
    }
    
    .botao-menu {
      padding: 10px 15px;
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
    }
    
    #lista-clubes {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    
    .clube-card {
      border: 1px solid #ddd;
      padding: 15px;
    }
    
    .clube-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .clube-sigla {
      font-weight: bold;
      margin-right: 10px;
    }
    
    .clube-nome {
      font-weight: bold;
    }
    
    .clube-info {
      margin-top: 10px;
    }
    
    .clube-info p {
      margin: 5px 0;
    }
    
    .vitorias-btn {
      margin-top: 10px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button class="botao-menu" onclick="window.location.href='index.html'">MENU</button>
  
  <div class="container">
    <h1>Clubes</h1>
    <div id="lista-clubes"></div>
  </div>

  <script>
    const url = 'http://localhost:8080/clubes';

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao buscar os clubes');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('lista-clubes');
        
        if (data.content && data.content.length > 0) {
          data.content.forEach(clube => {
            const card = document.createElement('div');
            card.className = 'clube-card';
            card.innerHTML = `
              <div class="clube-header">
                <div class="clube-sigla">${clube.sigla}</div>
                <div class="clube-nome">${clube.nome}</div>
              </div>
              <div class="clube-info">
                <p><strong>Cidade:</strong> ${clube.cidade}</p>
                <p><strong>Técnico:</strong> ${clube.nomeTecnico}</p>
                <button class="vitorias-btn" onclick="verVitorias(${clube.id})">
                  Ver Vitórias
                </button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          const errorMsg = document.createElement('p');
          errorMsg.textContent = 'Nenhum clube encontrado.';
          container.appendChild(errorMsg);
        }
      })
      .catch(error => {
        const errorMsg = document.createElement('p');
        errorMsg.textContent = error.message;
        document.getElementById('lista-clubes').appendChild(errorMsg);
        console.error('Erro:', error);
      });

    function verVitorias(clubeId) {
      fetch(`http://localhost:8080/clubes/clube/vitorias/${clubeId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar vitórias do clube');
          }
          return response.json();
        })
        .then(totalVitorias => {
          alert(`O clube possui ${totalVitorias} vitórias!`);
        })
        .catch(error => {
          console.error('Erro:', error);
          alert('Erro ao buscar vitórias: ' + error.message);
        });
    }
  </script>
</body>
</html>
