<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clubes de Basquete</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 20px;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      border: 3px solid #ff5e14;
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    
    h1 i {
      color: #ff5e14;
      margin: 0 10px;
    }
    
    .clubes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    .clube-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #ff5e14;
      transition: all 0.3s ease;
    }
    
    .clube-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    
    .clube-header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .clube-sigla {
      background-color: #ff5e14;
      color: white;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      margin-right: 15px;
    }
    
    .clube-nome {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2c3e50;
    }
    
    .clube-info {
      margin-top: 15px;
    }
    
    .clube-info p {
      margin: 8px 0;
      color: #333;
    }
    
    .clube-info strong {
      color: #2c3e50;
      font-weight: 600;
    }
    
    .vitorias-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      background: linear-gradient(45deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    
    .vitorias-btn:hover {
      background: linear-gradient(45deg, #2980b9, #3498db);
      transform: translateY(-2px);
    }
    
    .erro {
      color: #e74c3c;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 5px;
    }
    
    .voltar-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: linear-gradient(45deg, #2c3e50, #34495e);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .voltar-btn:hover {
      background: linear-gradient(45deg, #34495e, #2c3e50);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    @media (max-width: 768px) {
      .clubes-grid {
        grid-template-columns: 1fr;
      }
      
      .container {
        padding: 20px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>
      <i class="fas fa-basketball-ball"></i>
      Clubes de Basquete
      <i class="fas fa-basketball-ball"></i>
    </h1>
    
    <div class="clubes-grid" id="lista-clubes"></div>
    <p class="erro" id="mensagem-erro" style="display: none;"></p>
    
    <button class="voltar-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>

  <script>
    const url = 'http://localhost:8080/clubes';

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao buscar os clubes');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('lista-clubes');
        
        if (data.content && data.content.length > 0) {
          data.content.forEach(clube => {
            const card = document.createElement('div');
            card.className = 'clube-card';
            card.innerHTML = `
              <div class="clube-header">
                <div class="clube-sigla">${clube.sigla}</div>
                <div class="clube-nome">${clube.nome}</div>
              </div>
              <div class="clube-info">
                <p><strong>Cidade:</strong> ${clube.cidade}</p>
                <p><strong>Técnico:</strong> ${clube.nomeTecnico}</p>
                <button class="vitorias-btn" onclick="verVitorias(${clube.id})">
                  <i class="fas fa-trophy"></i> Ver Vitórias
                </button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          document.getElementById('mensagem-erro').style.display = 'block';
          document.getElementById('mensagem-erro').textContent = 'Nenhum clube encontrado.';
        }
      })
      .catch(error => {
        document.getElementById('mensagem-erro').style.display = 'block';
        document.getElementById('mensagem-erro').textContent = error.message;
        console.error('Erro:', error);
      });

    function verVitorias(clubeId) {
      fetch(`http://localhost:8080/clubes/clube/vitorias/${clubeId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar vitórias do clube');
          }
          return response.json();
        })
        .then(totalVitorias => {
          alert(`O clube possui ${totalVitorias} vitórias!`);
        })
        .catch(error => {
          console.error('Erro:', error);
          alert('Erro ao buscar vitórias: ' + error.message);
        });
    }
  </script>
</body>
</html>
