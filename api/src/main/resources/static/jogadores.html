<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Jogadores de Basquete</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 20px;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      border: 3px solid #ff5e14;
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    
    h1 i {
      color: #ff5e14;
      margin: 0 10px;
    }
    
    #lista-jogadores {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    
    .jogador-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #ff5e14;
      transition: all 0.3s ease;
    }
    
    .jogador-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
    }
    
    .jogador-info {
      margin-bottom: 15px;
    }
    
    .jogador-info p {
      margin: 8px 0;
      font-size: 16px;
      color: #333;
    }
    
    .jogador-info strong {
      color: #2c3e50;
      font-weight: 600;
      display: inline-block;
      width: 120px;
    }
    
    .botoes-jogador {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }
    
    .botao-perfil, .botao-pdf {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .botao-perfil {
      background: linear-gradient(45deg, #3498db, #2980b9);
      color: white;
    }
    
    .botao-pdf {
      background: linear-gradient(45deg, #e74c3c, #c0392b);
      color: white;
    }
    
    .botao-perfil:hover {
      background: linear-gradient(45deg, #2980b9, #3498db);
      transform: translateY(-2px);
    }
    
    .botao-pdf:hover {
      background: linear-gradient(45deg, #c0392b, #e74c3c);
      transform: translateY(-2px);
    }
    
    #erro {
      color: #e74c3c;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 5px;
      margin-top: 20px;
    }
    
    .voltar-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: linear-gradient(45deg, #2c3e50, #34495e);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .voltar-btn:hover {
      background: linear-gradient(45deg, #34495e, #2c3e50);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    @media (max-width: 768px) {
      .container {
        padding: 20px;
      }
      
      .botoes-jogador {
        flex-direction: column;
      }
      
      .jogador-info strong {
        width: 100px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>
      <i class="fas fa-basketball-ball"></i>
      Lista de Jogadores
      <i class="fas fa-basketball-ball"></i>
    </h1>
    
    <div id="lista-jogadores"></div>
    <p id="erro" style="display: none;"></p>
    
    <button class="voltar-btn" onclick="window.location.href='index.html'">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>

  <script>
    const url = 'http://localhost:8080/jogadores';

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao buscar jogadores');
        }
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('lista-jogadores');
        
        if (data.content && data.content.length > 0) {
          data.content.forEach(jogador => {
            const card = document.createElement('div');
            card.className = 'jogador-card';
            card.innerHTML = `
              <div class="jogador-info">
                <p><strong>Nome:</strong> ${jogador.nome}</p>
                <p><strong>Altura:</strong> ${jogador.altura} cm</p>
                <p><strong>Peso:</strong> ${jogador.peso} kg</p>
                <p><strong>Clube:</strong> ${jogador.clube.nome} (${jogador.clube.sigla}) - ${jogador.clube.cidade}/${jogador.clube.estado}</p>
                <p><strong>Técnico:</strong> ${jogador.clube.tecnico.nome}</p>
              </div>
              <div class="botoes-jogador">
                <button class="botao-perfil" onclick="window.location.href='perfil-jogador.html?id=${jogador.id}'">
                  <i class="fas fa-user"></i> Ver Perfil
                </button>
                <button class="botao-pdf" onclick="exportarPDF(${jogador.id})">
                  <i class="fas fa-file-pdf"></i> Exportar PDF
                </button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          document.getElementById('erro').style.display = 'block';
          document.getElementById('erro').textContent = 'Nenhum jogador encontrado.';
        }
      })
      .catch(error => {
        document.getElementById('erro').style.display = 'block';
        document.getElementById('erro').textContent = error.message;
        console.error('Erro:', error);
      });

    function exportarPDF(jogadorId) {
      fetch(`http://localhost:8080/api/jogadores/${jogadorId}/exportar-pdf`, {
        method: 'GET',
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao exportar PDF');
        }
        return response.blob();
      })
      .then(blob => {
        // Cria um link para download do PDF
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jogador-${jogadorId}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao exportar PDF: ' + error.message);
      });
    }
  </script>
</body>
</html>
