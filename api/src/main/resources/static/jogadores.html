<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogadores</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      margin: 20px;
    }
    
    .botao-menu {
      padding: 10px 15px;
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
    }
    
    #lista-jogadores {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .jogador-card {
      border: 1px solid #ddd;
      padding: 15px;
    }
    
    .jogador-info p {
      margin: 5px 0;
    }
    
    .botoes-jogador {
      margin-top: 10px;
    }
    
    .botoes-jogador button {
      padding: 5px 10px;
      margin-right: 10px;
      cursor: pointer;
    }
    
    #erro {
      color: #000;
      margin-top: 20px;
    }
    
    .paginacao {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    
    .paginacao button {
      padding: 5px 10px;
      cursor: pointer;
    }
    
    .pagina-atual {
      font-weight: bold;
    }
    
    .sem-dados {
      text-align: center;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <button class="botao-menu" onclick="window.location.href='index.html'">MENU</button>
  
  <div class="container">
    <h1>Jogadores</h1>
    <div id="erro"></div>
    <div id="lista-jogadores"></div>
    <div class="paginacao">
      <button id="btn-anterior" disabled>Anterior</button>
      <span id="pagina-atual" class="pagina-atual">1</span>
      <button id="btn-proximo">Próxima</button>
    </div>
  </div>

  <script>
    let paginaAtual = 0;
    const itensPorPagina = 10;
    let totalPaginas = 1;

    function carregarJogadores(pagina) {
      const url = `http://localhost:8080/jogadores?page=${pagina}&size=${itensPorPagina}`;

      fetch(url)
        .then(response => {
          if (!response.ok) {
            // Se houver erro, retorna um objeto vazio
            return {
              content: [],
              totalPages: 1
            };
          }
          return response.json();
        })
        .then(data => {
          const container = document.getElementById('lista-jogadores');
          container.innerHTML = '';
          
          if (data.content && data.content.length > 0) {
            data.content.forEach(jogador => {
              const card = document.createElement('div');
              card.className = 'jogador-card';
              card.innerHTML = `
                <div class="jogador-info">
                  <p><strong>Nome:</strong> ${jogador.nome || 'N/A'}</p>
                  <p><strong>Altura:</strong> ${jogador.altura || 0} cm</p>
                  <p><strong>Peso:</strong> ${jogador.peso || 0} kg</p>
                  <p><strong>Clube:</strong> ${jogador.clube?.nome || 'N/A'} (${jogador.clube?.sigla || 'N/A'}) - ${jogador.clube?.cidade || 'N/A'}/${jogador.clube?.estado || 'N/A'}</p>
                  <p><strong>Técnico:</strong> ${jogador.clube?.tecnico?.nome || 'N/A'}</p>
                  <p><strong>Pontuação Total:</strong> ${jogador.pontuacaoTotal || 0}</p>
                </div>
                <div class="botoes-jogador">
                  <button class="botao-perfil" onclick="window.location.href='perfil-jogador.html?id=${jogador.id}'">
                    Ver Perfil
                  </button>
                  <button class="botao-pdf" onclick="exportarPDF(${jogador.id})">
                    Exportar PDF
                  </button>
                </div>
              `;
              container.appendChild(card);
            });
          } else {
            // Exibe um card com valores zerados quando não há dados
            const card = document.createElement('div');
            card.className = 'sem-dados';
            card.innerHTML = `
              <div class="jogador-info">
                <p><strong>Nome:</strong> N/A</p>
                <p><strong>Altura:</strong> 0 cm</p>
                <p><strong>Peso:</strong> 0 kg</p>
                <p><strong>Clube:</strong> N/A (N/A) - N/A/N/A</p>
                <p><strong>Técnico:</strong> N/A</p>
                <p><strong>Pontuação Total:</strong> 0</p>
              </div>
              <p>Nenhum jogador encontrado ou dados disponíveis.</p>
            `;
            container.appendChild(card);
          }

          // Atualiza controles de paginação
          totalPaginas = data.totalPages || 1;
          document.getElementById('pagina-atual').textContent = pagina + 1;
          document.getElementById('btn-anterior').disabled = pagina === 0;
          document.getElementById('btn-proximo').disabled = pagina >= totalPaginas - 1;
        })
        .catch(error => {
          console.error('Erro:', error);
          // Exibe um card com valores zerados em caso de erro
          const container = document.getElementById('lista-jogadores');
          container.innerHTML = '';
          
          const card = document.createElement('div');
          card.className = 'sem-dados';
          card.innerHTML = `
            <div class="jogador-info">
              <p><strong>Nome:</strong> N/A</p>
              <p><strong>Altura:</strong> 0 cm</p>
              <p><strong>Peso:</strong> 0 kg</p>
              <p><strong>Clube:</strong> N/A (N/A) - N/A/N/A</p>
              <p><strong>Técnico:</strong> N/A</p>
              <p><strong>Pontuação Total:</strong> 0</p>
            </div>
            <p>Não foi possível carregar os dados dos jogadores.</p>
          `;
          container.appendChild(card);
        });
    }

    // Event listeners para os botões de paginação
    document.getElementById('btn-anterior').addEventListener('click', () => {
      if (paginaAtual > 0) {
        paginaAtual--;
        carregarJogadores(paginaAtual);
      }
    });

    document.getElementById('btn-proximo').addEventListener('click', () => {
      if (paginaAtual < totalPaginas - 1) {
        paginaAtual++;
        carregarJogadores(paginaAtual);
      }
    });

    function exportarPDF(jogadorId) {
      fetch(`http://localhost:8080/api/jogadores/${jogadorId}/exportar-pdf`, {
        method: 'GET',
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao exportar PDF');
        }
        return response.blob();
      })
      .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `jogador-${jogadorId}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao exportar PDF: ' + error.message);
      });
    }

    // Carrega a primeira página ao iniciar
    carregarJogadores(paginaAtual);
  </script>
</body>
</html>
