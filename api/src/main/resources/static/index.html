<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      margin: 20px;
      text-align: center;
    }
    
    .botoes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .botao {
      padding: 15px 10px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #ccc;
      background-color: #fff;
    }
    
    h1 {
      font-size: 24px;
      margin-top: 20px;
    }
    .botao:hover {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>HOOPS METRICS</h1>

    <div class="botoes-grid">
      <button class="botao" onclick="window.location.href='tecnicos.html'">TÉCNICOS</button>
      <button class="botao" onclick="window.location.href='clubes.html'">CLUBES</button>
      <button class="botao" onclick="window.location.href='jogadores.html'">JOGADORES</button>
      <button class="botao" onclick="window.location.href='partidas.html'">PARTIDAS</button>
    </div>
  </div>
</body>
</html>
