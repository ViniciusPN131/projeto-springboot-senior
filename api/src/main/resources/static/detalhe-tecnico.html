<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Técnico</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      text-align: center;
    }
    
    h1 {
      margin-bottom: 20px;
    }
    
    .stats-container {
      margin: 20px 0;
    }
    
    .stat-card {
      padding: 15px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }
    
    .stat-value {
      font-size: 1.5rem;
      margin: 5px 0;
      font-weight: bold;
    }
    
    .loading, .erro {
      padding: 10px;
      margin: 10px 0;
      text-align: center;
    }
    
    .voltar-btn {
      padding: 10px 15px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Estatísticas do Técnico</h1>
    
    <div class="loading" id="loading">Carregando estatísticas...</div>
    <div class="erro" id="mensagem-erro" style="display: none;"></div>
    
    <div class="stats-container" id="stats-container" style="display: none;">
      <div class="stat-card">
        <div class="stat-label">Vitórias</div>
        <div class="stat-value" id="vitorias">0</div>
      </div>
    </div>
    
    <button class="voltar-btn" onclick="window.location.href='tecnicos.html'">Voltar</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('mensagem-erro').style.display = 'block';
      document.getElementById('mensagem-erro').textContent = 'ID do técnico não informado.';
      document.getElementById('loading').style.display = 'none';
    } else {
      const url = `http://localhost:8080/tecnicos/tecnico/vitorias/${id}`;
      
      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar as vitórias do técnico');
          }
          return response.json();
        })
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('stats-container').style.display = 'block';
          document.getElementById('vitorias').textContent = data || '0';
        })
        .catch(error => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('mensagem-erro').style.display = 'block';
          document.getElementById('mensagem-erro').textContent = error.message;
          console.error('Erro:', error);
        });
    }
  </script>
</body>
</html>
