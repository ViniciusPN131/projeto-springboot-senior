<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Técnicos</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    
    .container {
      margin: 20px;
    }
    
    .botao-menu {
      padding: 10px 15px;
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
    }
    
    #lista-tecnicos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    
    .tecnico-card {
      border: 1px solid #ddd;
      padding: 10px;
      cursor: pointer;
    }
    
    .tecnico-card:hover {
      background-color: #f5f5f5;
    }
    
    #mensagem-erro {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <button class="botao-menu" onclick="window.location.href='index.html'">MENU</button>
  
  <div class="container">
    <h1>Técnicos</h1>
    <div id="mensagem-erro"></div>
    <div id="lista-tecnicos"></div>
  </div>

  <script>
    const url = 'http://localhost:8080/tecnicos';

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao buscar os técnicos');
        }
        return response.json();
      })
      .then(data => {
        const lista = document.getElementById('lista-tecnicos');
        
        if (data.content && data.content.length > 0) {
          data.content.forEach(tecnico => {
            const card = document.createElement('div');
            card.className = 'tecnico-card';
            card.innerHTML = `
              <div class="tecnico-nome">${tecnico.nome}</div>
            `;
            card.onclick = () => {
              window.location.href = `detalhe-tecnico.html?id=${tecnico.id}`;
            };
            lista.appendChild(card);
          });
        } else {
          document.getElementById('mensagem-erro').textContent = 'Nenhum técnico encontrado.';
        }
      })
      .catch(error => {
        document.getElementById('mensagem-erro').textContent = error.message;
        console.error('Erro:', error);
      });
  </script>
</body>
</html>
