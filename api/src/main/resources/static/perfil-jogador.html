<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Jogador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background-color: #f5f5f5;
      min-height: 100vh;
      background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
      background-size: cover;
      position: relative;
      padding: 20px;
    }
    
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      border: 3px solid #ff5e14;
    }
    
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.2rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
    }
    
    h1 i {
      color: #ff5e14;
      margin: 0 10px;
    }
    
    .info-jogador {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #ff5e14;
    }
    
    .info-jogador p {
      margin: 10px 0;
      font-size: 1.1rem;
      color: #2c3e50;
    }
    
    .info-jogador strong {
      color: #ff5e14;
      font-weight: 600;
      display: inline-block;
      width: 180px;
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-left: 5px solid #ff5e14;
      text-align: center;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #ff5e14;
      margin: 10px 0;
    }
    
    .stat-label {
      font-size: 1rem;
      color: #2c3e50;
      font-weight: 600;
    }
    
    .loading {
      color: #2c3e50;
      text-align: center;
      padding: 30px;
      font-style: italic;
    }
    
    .error {
      color: #e74c3c;
      text-align: center;
      padding: 20px;
      font-weight: bold;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 5px;
    }
    
    .warning {
      color: #FF9800;
      text-align: center;
      padding: 15px;
      font-style: italic;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 5px;
    }
    
    .voltar-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;
      background: linear-gradient(45deg, #2c3e50, #34495e);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .voltar-btn:hover {
      background: linear-gradient(45deg, #34495e, #2c3e50);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    @media (max-width: 768px) {
      .stats-container {
        grid-template-columns: 1fr;
      }
      
      .container {
        padding: 20px;
      }
      
      .info-jogador strong {
        width: 120px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1>
      <i class="fas fa-basketball-ball"></i>
      Perfil do Jogador
      <i class="fas fa-basketball-ball"></i>
    </h1>
    
    <div class="info-jogador">
      <p><strong>ID do Jogador:</strong> <span id="jogador-id"></span></p>
    </div>
    
    <h2 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">Estatísticas Gerais</h2>
    
    <div class="loading" id="loading">Carregando estatísticas...</div>
    <div class="warning" id="warning" style="display: none;">
      Estatísticas não disponíveis. Exibindo valores zerados.
    </div>
    <div class="error" id="error" style="display: none;"></div>
    
    <div class="stats-container" id="stats-container" style="display: none;">
      <div class="stat-card">
        <div class="stat-label">Total de Pontos</div>
        <div class="stat-value" id="total-pontos">0</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Turnovers</div>
        <div class="stat-value" id="turnovers">0</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Total de Faltas</div>
        <div class="stat-value" id="total-faltas">0</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Roubos de Bola</div>
        <div class="stat-value" id="roubos-bola">0</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Rebotes Ofensivos</div>
        <div class="stat-value" id="rebotes-ofensivos">0</div>
      </div>
      
      <div class="stat-card">
        <div class="stat-label">Rebotes Defensivos</div>
        <div class="stat-value" id="rebotes-defensivos">0</div>
      </div>
    </div>
    
    <button class="voltar-btn" onclick="window.location.href='javascript:history.back()'">
      <i class="fas fa-arrow-left"></i> Voltar
    </button>
  </div>

  <script>
    // Função para zerar todas as estatísticas
    function zerarEstatisticas() {
      document.getElementById('total-pontos').textContent = '0';
      document.getElementById('turnovers').textContent = '0';
      document.getElementById('total-faltas').textContent = '0';
      document.getElementById('roubos-bola').textContent = '0';
      document.getElementById('rebotes-ofensivos').textContent = '0';
      document.getElementById('rebotes-defensivos').textContent = '0';
      
      document.getElementById('warning').style.display = 'block';
    }

    // Função para carregar e exibir estatísticas
    function carregarEstatisticas(jogadorId) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('warning').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('stats-container').style.display = 'none';
      
      fetch(`http://localhost:8080/jogadores/jogador/geral/${jogadorId}`)
        .then(response => {
          if (!response.ok) {
            throw new Error('Erro ao buscar estatísticas do jogador');
          }
          return response.json();
        })
        .then(data => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('stats-container').style.display = 'grid';
          
          if (data && typeof data === 'object') {
            document.getElementById('total-pontos').textContent = data.totalPontos || '0';
            document.getElementById('turnovers').textContent = data.turnovers || '0';
            document.getElementById('total-faltas').textContent = data.totalFaltas || '0';
            document.getElementById('roubos-bola').textContent = data.roubos_de_bola || '0';
            document.getElementById('rebotes-ofensivos').textContent = data.rebotes_ofensivos || '0';
            document.getElementById('rebotes-defensivos').textContent = data.rebotes_defensivos || '0';
          } else {
            zerarEstatisticas();
          }
        })
        .catch(error => {
          console.error('Erro:', error);
          document.getElementById('loading').style.display = 'none';
          zerarEstatisticas();
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').textContent = 'Erro ao carregar estatísticas: ' + error.message;
        });
    }

    // Obtém o ID do jogador da URL
    const urlParams = new URLSearchParams(window.location.search);
    const jogadorId = urlParams.get('id');

    if (!jogadorId) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'ID do jogador não especificado na URL';
      document.getElementById('loading').style.display = 'none';
      zerarEstatisticas();
    } else {
      document.getElementById('jogador-id').textContent = jogadorId;
      carregarEstatisticas(jogadorId);
    }
  </script>
</body>
</html>
